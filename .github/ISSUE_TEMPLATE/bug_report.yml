name: 🐛 Bug Report
description: SyncLore 自体の不具合を報告する
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        SyncLore (sync.yml / convert.js / synclore-delete.js / その他) の不具合報告です。
        記事コンテンツの間違いではなく、**ツールが期待通り動かない場合**に使ってください。

  - type: textarea
    id: description
    attributes:
      label: 何が起きたか
      description: 期待した動作と、実際に起きたことを書いてください
      placeholder: |
        - 期待: drafts/foo.md を `publish: true` で push したら Zenn に出る
        - 実際: Zenn に出ない / sync.yml が失敗する / etc.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: 再現手順
      description: どんな drafts と操作で再現するか
      placeholder: |
        1. drafts/foo.md を作って publish: true にする
        2. main に push する
        3. ...
    validations:
      required: true

  - type: input
    id: workflow_run
    attributes:
      label: 失敗した workflow run の URL
      description: 該当するなら GitHub Actions の run リンク
      placeholder: https://github.com/.../actions/runs/...
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: ログ抜粋
      description: 関係する箇所だけで OK (機密が混ざらないよう注意)
      render: text
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: 補足
      description: スクリーンショット、関連 PR、考えられる原因など
    validations:
      required: false
