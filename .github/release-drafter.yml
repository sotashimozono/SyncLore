name-template: "$NEXT_PATCH_VERSION"
tag-template: "v$NEXT_PATCH_VERSION"
version-resolver:
  default: patch

# 記事公開の履歴を Releases に蓄積するための分類。
# autolabeler が PR の branch 名 / タイトルから自動でラベルを付ける。
categories:
  - title: "📝 New articles"
    labels:
      - "article-new"
  - title: "✏️ Updated articles"
    labels:
      - "article-update"
  - title: "🚪 Unpublished"
    labels:
      - "article-unpublish"
  - title: "🗑 Deleted articles"
    labels:
      - "article-delete"
  - title: "🔧 Maintenance (SyncLore 自体の改修)"
    labels:
      - "chore"
      - "refactor"
      - "fix"
      - "feat"

# Branch 名 / PR タイトルから自動でラベル付与。
# ローカルで使う branch 命名規約:
#   add/<slug>     -> article-new
#   edit/<slug>    -> article-update
#   unpub/<slug>   -> article-unpublish
#   delete/<slug>  -> article-delete
#   chore/* / fix/* / feat/* / refactor/* / hotfix/* -> maintenance
autolabeler:
  - label: "article-new"
    branch:
      - '/^add\/.+$/'
    title:
      - '/^add[: ]/i'
  - label: "article-update"
    branch:
      - '/^edit\/.+$/'
    title:
      - '/^edit[: ]/i'
  - label: "article-unpublish"
    branch:
      - '/^unpub\/.+$/'
    title:
      - '/^unpub[: ]/i'
  - label: "article-delete"
    branch:
      - '/^delete\/.+$/'
    title:
      - '/^delete[: ]/i'
  - label: "chore"
    branch:
      - '/^chore\/.+$/'
    title:
      - '/^chore[: ]/i'
  - label: "refactor"
    branch:
      - '/^refactor\/.+$/'
    title:
      - '/^refactor[: ]/i'
  - label: "fix"
    branch:
      - '/^fix\/.+$/'
      - '/^hotfix\/.+$/'
    title:
      - '/^fix[: ]/i'
      - '/^hotfix[: ]/i'
  - label: "feat"
    branch:
      - '/^feat\/.+$/'
    title:
      - '/^feat[: ]/i'

template: |
  $CHANGES

  ---
  Generated by SyncLore. See `INDEX.md` on the [deploy branch](../../blob/deploy/INDEX.md) for the live article list.
