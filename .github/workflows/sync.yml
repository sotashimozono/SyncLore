name: Sync Drafts to Zenn & Qiita

on:
  push:
    branches: [main]
    paths:
      - "drafts/**"
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/sync.yml"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# main / deploy の両方への push 操作が並走しないように直列化
concurrency:
  group: synclore-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      DEPLOY_DIR: .deploy
    steps:
      # main: ソース (drafts/, src/, sync.yml) の checkout
      - name: Checkout main (sources)
        uses: actions/checkout@v6
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      # deploy: 生成物 (articles/, public/, images/) の checkout
      # 別ディレクトリ .deploy/ にチェックアウトすることで main の working tree
      # に articles/ などが生えないようにする (Option A の核心)。
      - name: Checkout deploy (artifacts)
        uses: actions/checkout@v6
        with:
          ref: deploy
          token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ env.DEPLOY_DIR }}
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # drafts/<slug>.md に delete:true がある記事を完全削除する。
      # qiita publish --all より前に走らせないと syncArticlesFromQiita で
      # public/<slug>.md が復活してしまう。
      - name: Process deletions (Qiita API DELETE + repo cleanup)
        env:
          QIITA_TOKEN: ${{ secrets.QIITA_TOKEN }}
          SYNCLORE_DEPLOY_ROOT: ${{ github.workspace }}/${{ env.DEPLOY_DIR }}
        run: node src/synclore-delete.js

      # drafts/*.md を .deploy/{articles,public,images}/ に冪等変換
      - name: Convert drafts -> .deploy/{articles,public,images}/
        env:
          SYNCLORE_DEPLOY_ROOT: ${{ github.workspace }}/${{ env.DEPLOY_DIR }}
        run: node src/convert.js

      # qiita-cli は cwd の public/ を読むので .deploy/ から実行する。
      # node_modules は main 側に npm ci 済みなので symlink で共有。
      # package.json も qiita-cli が package 名解決に参照するので link しておく。
      - name: Publish to Qiita (writes back ids to .deploy/public/)
        env:
          QIITA_TOKEN: ${{ secrets.QIITA_TOKEN }}
        run: |
          if [ -z "${QIITA_TOKEN}" ]; then
            echo "::error::QIITA_TOKEN secret is not set."
            exit 1
          fi
          ln -sfn "${{ github.workspace }}/node_modules" "${{ env.DEPLOY_DIR }}/node_modules"
          ln -sfn "${{ github.workspace }}/package.json" "${{ env.DEPLOY_DIR }}/package.json"
          ln -sfn "${{ github.workspace }}/package-lock.json" "${{ env.DEPLOY_DIR }}/package-lock.json"
          cd "${{ env.DEPLOY_DIR }}"
          echo "QIITA_TOKEN=${QIITA_TOKEN}" > .env
          npx qiita publish --all
          rm -f .env
          rm -f node_modules package.json package-lock.json

      # deploy branch は branch protection で直 push 不可なので PR + auto-merge。
      # path: .deploy で peter-evans/create-pull-request を deploy worktree に
      # 限定し、main 側の変更は commit させない。
      - name: Create PR on deploy branch
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ env.DEPLOY_DIR }}
          base: deploy
          commit-message: "[CI] sync articles from drafts"
          branch: ci/sync-articles
          delete-branch: true
          title: "[CI] Sync articles from drafts"
          body: |
            `drafts/` の変更を Zenn・Qiita 形式に変換しました。
            - Qiita publish 済み (id は `public/<slug>.md` に保管)
            - Zenn は merge 後に GitHub 連携で取り込みます

      - name: Enable auto-merge
        if: steps.cpr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge ${{ steps.cpr.outputs.pull-request-number }} --auto --merge --repo ${{ github.repository }}
