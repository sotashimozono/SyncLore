name: Sync Drafts to Zenn & Qiita

on:
  push:
    branches: [main]
    paths:
      - "drafts/**"
      - "src/convert.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/sync.yml"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# 同時実行を直列化して PR と Qiita publish のレースを防ぐ
concurrency:
  group: synclore-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # drafts/*.md を articles/, public/, images/ に冪等変換
      - name: Convert drafts -> articles/, public/, images/
        run: node src/convert.js

      # Atomic 設計: Qiita publish が成功したときだけ生成物を PR にする。
      # qiita-cli は新規記事の id を public/<slug>.md に書き戻すため、
      # 必ず convert -> qiita publish -> PR の順で走らせる。
      - name: Publish to Qiita (writes back ids to public/)
        env:
          QIITA_TOKEN: ${{ secrets.QIITA_TOKEN }}
        run: |
          if [ -z "${QIITA_TOKEN}" ]; then
            echo "::error::QIITA_TOKEN secret is not set."
            exit 1
          fi
          echo "QIITA_TOKEN=${QIITA_TOKEN}" > .env
          npx qiita publish --all
          rm -f .env

      # main は branch protection で直 push 不可。PR を作って auto-merge する。
      # Zenn は merge 後の main commit を GitHub 連携で webhook 検知して反映する。
      - name: Create PR for generated outputs
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "[CI] sync articles from drafts"
          branch: ci/sync-articles
          delete-branch: true
          title: "[CI] Sync articles from drafts"
          body: |
            `drafts/` の変更を Zenn・Qiita 形式に変換しました。
            - Qiita publish 済み (id は `public/<slug>.md` に保管)
            - Zenn は merge 後に GitHub 連携で取り込みます
          add-paths: |
            articles/**
            public/**
            images/**

      - name: Enable auto-merge
        if: steps.cpr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge ${{ steps.cpr.outputs.pull-request-number }} --auto --merge
