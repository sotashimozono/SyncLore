name: Sync Drafts to Zenn & Qiita

on:
  push:
    branches: [main]
    paths:
      - "drafts/**"
      - "src/convert.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/sync.yml"
  workflow_dispatch:

permissions:
  contents: write

# 同時実行を直列化して git push と Qiita publish のレースを防ぐ
concurrency:
  group: synclore-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # drafts/*.md を articles/, public/, images/ に冪等変換
      - name: Convert drafts -> articles/, public/, images/
        run: node src/convert.js

      # Atomic 設計: Qiita publish が成功したときだけ生成物を commit する。
      # qiita-cli は新規記事の id を public/<slug>.md に書き戻すため、
      # 必ず convert -> qiita publish -> git commit の順で走らせる。
      - name: Publish to Qiita (writes back ids to public/)
        env:
          QIITA_TOKEN: ${{ secrets.QIITA_TOKEN }}
        run: |
          if [ -z "${QIITA_TOKEN}" ]; then
            echo "::error::QIITA_TOKEN secret is not set."
            exit 1
          fi
          echo "QIITA_TOKEN=${QIITA_TOKEN}" > .env
          npx qiita publish --all
          rm -f .env

      # Zenn は GitHub 連携でこの commit を webhook 検知して反映する
      - name: Commit & push generated outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add articles/ public/ images/
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "[CI] sync articles from drafts"
            git push
          fi
